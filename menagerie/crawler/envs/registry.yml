  "intents": {
    "core": {"phase": "pytorch", "framework": "pytorch", "description": "Current general PyTorch, vision, segmentation, and Hugging Face stack.", "split_guidance": "Split only for a demonstrated incompatible major ecosystem stack. segmentation-models-pytorch joins core because an osx-arm64 solve adds only five noarch packages (segmentation-models-pytorch, pretrainedmodels, efficientnet-pytorch, munch, six) and moves no pinned version; its timm requirement was already satisfied. zuko joins core on the same basis: an osx-arm64 solve adds only the zuko noarch package itself and moves nothing. dgl is deliberately excluded: see the graph guidance. recbole, d3rlpy, and bindsnet are deliberately excluded: see the recsys guidance."},
    "graph": {"phase": "pytorch", "framework": "pytorch", "description": "Graph, molecular, geometric, and scientific PyTorch stack.", "split_guidance": "Separate DGL from PyG only if target solving proves they cannot coexist; an osx-arm64 solve shows dgl 2.3.0 and pyg 2.6.1 do coexist, so keep them together. This intent must stay separate from core: conda-forge dgl pins pytorch >=2.3.1,<2.3.2 CPU-only and depends on tensorflow, so folding it into core would downgrade pytorch 2.13 -> 2.3.1, torchvision 0.28 -> 0.18.1, numpy 2.5.1 -> 1.26.4 and add the whole TensorFlow 2.17 stack for every core model. dgl 1.1.3, the last PyPI release with non-Windows wheels, is strictly worse here: it caps pytorch below 2.2 and is unsatisfiable against the core floor. pykeen is pip-only and rides in through the pinned pip overlay (pip-overlay.in); its KG-embedding models route here."},
    "audio": {"phase": "pytorch", "framework": "pytorch", "description": "Audio, codec, vocoder, and music stack.", "split_guidance": "Split compiled codec stacks only after an evidenced ABI conflict. The soundfile distribution is spelled pysoundfile in the conda-forge inventory namespace (the package_namespace bridge maps it back). speechbrain has NO conda distribution on any channel, so it must never be declared among the CONDA dependencies (declaring it broke the entire audio solve and stranded every torchaudio/librosa model behind it); it lives in the speech intent's pip overlay instead, because its supported torchaudio range (<2.9) cannot ride on this stack's modern floor. espnet stays walled either way: it is unsatisfiable on osx-arm64 at the PLATFORM level (nothing provides ctc-segmentation >=1.6.6 for espnet-202301/202211, solver-evidenced 2026-08-09), which no pip lane fixes."},
    "speech": {"phase": "pytorch", "framework": "pytorch", "description": "SpeechBrain speech-processing stack on the bounded torchaudio<2.9 pairing its pip overlay requires.", "split_guidance": "This intent exists because of a solver/runtime-proven three-way incompatibility: speechbrain 1.1.0 requires soundfile>=0.12.1 while conda-forge pysoundfile tops out at 0.11 (and overlay rows may never shadow conda-provided distributions), and speechbrain<=1.0.3 calls torchaudio.list_audio_backends, removed in torchaudio 2.9 -- so speechbrain cannot ride the audio intent's modern torchaudio without taxing every audio model down to 2.8. speechbrain arrives through the pinned pip overlay (pip-overlay.in). Fold this intent back into audio when conda-forge pysoundfile reaches 0.12 and speechbrain 1.1+ can ride a current torchaudio."},
    "mmlab": {"phase": "pytorch", "framework": "pytorch", "description": "Compatible OpenMMLab training and vision stack.", "split_guidance": "Split by mutually incompatible mmcv generation, never by individual model."},
    "tabular-ts": {"phase": "pytorch", "framework": "pytorch", "description": "Tabular, recommendation, survival, and time-series stack.", "split_guidance": "Split only on demonstrated NumPy or Lightning major-version conflicts. recbole cannot join this intent: its only conda builds (channel aibox) stop at python 3.10 while this stack pins python>=3.11, a solver-proven incompatibility; those models live in recsys. tsai cannot join either: its only conda builds (channel timeseriesai) pin pytorch <2.3 against this stack's >=2.3 floor, and the intent never solved anywhere while tsai was declared here. pytorch-tabnet is the same story: conda-forge stops at 4.0, which pins pytorch <2.0 and numpy <2. Both live in legacy-torch, whose bounds they fit without moving a pin."},
    "recsys": {"phase": "pytorch", "framework": "pytorch", "description": "Recommendation, offline-RL, and spiking-network library stack on the pinned python 3.10 / pytorch 2.5 pairing its conda builds require.", "split_guidance": "This intent exists because an on-target solve proves recbole's only conda builds (channel aibox, <=py310, pytorch>=2.5.1,<2.6) cannot coexist with the python>=3.11 stacks; ~100 recbole-named roster rows clear the 25-model floor. d3rlpy 2.8.1 (needs pytorch>=2.5) and bindsnet 0.3.3 (python <3.12; 0.3.4 pins python 3.11 exactly and is unsatisfiable here) ride along because the same osx-arm64 solve carries all three together. Split only if a future solve proves the trio can no longer coexist."},
    "detect-misc": {"phase": "pytorch", "framework": "pytorch", "description": "Detectron2, MMDetection, Ultralytics, and specialized compiled CV operations.", "split_guidance": "The designated arm64 build pool has two attempts before evidenced x86 deferral. conda-forge ships compiled detectron2 0.6 and mmcv osx-arm64 builds, so the whole stack solves on-target (verified 2026-08-09: detectron2 0.6 + mmcv 2.1 + mmdet 3.3 + ultralytics against pytorch 2.1.2); source builds are the fallback, not the default. ultralytics joins because the same solve carries it with no pin movement and detection models share this stack's opencv/pycocotools base."},
    "legacy-torch": {"phase": "pytorch", "framework": "pytorch", "description": "Bounded older Python and PyTorch compatibility stack.", "split_guidance": "Split only when a materially different old torch major serves at least 25 models. tsai rides here (channel timeseriesai): it pins pytorch <2.3, and an osx-arm64 solve carries tsai 0.3.9 + fastai inside this stack's declared bounds with zero moved pins; fastcore stays <1.8 because tsai 0.3.9 star-imports fastcore.dispatch, which fastcore 1.8 moved to fasttransform (canary-evidenced ImportError). pytorch-tabnet rides here too: conda-forge stops at 4.0, which pins pytorch <2.0 and numpy <2 against every modern stack."},
    "oddballs": {"phase": "pytorch", "framework": "pytorch", "description": "Minimal base for pinned exact research repositories.", "split_guidance": "Add a thick sub-stack only for at least 25 compatible repository models."},
    "tf-keras-arm64": {"phase": "native-tail", "framework": "tensorflow", "description": "Native TensorFlow and Keras stack for Apple Silicon.", "split_guidance": "Split only across an evidenced incompatible TensorFlow/Keras generation."},
    "jax-flax-arm64": {"phase": "native-tail", "framework": "jax", "description": "Native CPU JAX, Flax, and Optax stack for Apple Silicon.", "split_guidance": "Split only across an evidenced incompatible JAX/Flax generation."},
    "paddle-arm64": {"phase": "native-tail", "framework": "paddle", "description": "Native Paddle stack for Apple Silicon where supported.", "split_guidance": "Do not substitute unofficial artifacts; defer only with platform evidence. paddlepaddle has NO conda-forge osx-arm64 build; the OFFICIAL 'paddle' channel ships them (3.0.0 py311/py312 verified 2026-08-09) and must stay in this intent's channel list or the solve fails outright."}
