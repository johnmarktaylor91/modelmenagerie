# CPU prefix: compile-free MMCV wheel paired with its official PyTorch ABI.
[workspace]
name = "menagerie-mmlab-canary"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pyvips = "==3.2.0"

[pypi-options]
no-build = true

[pypi-dependencies]
torch = {url = "https://download.pytorch.org/whl/cpu/torch-2.1.0%2Bcpu-cp311-cp311-linux_x86_64.whl#sha256=5954924ce74bc7e6a6c811e3fa4bdda9936d9889f6369fd068420c444bfd1cae"}
torchvision = {url = "https://download.pytorch.org/whl/cpu/torchvision-0.16.0%2Bcpu-cp311-cp311-linux_x86_64.whl#sha256=be317c0b0b32d008309a1de6018e77b500d1cf966e158a5db1070da5c0cfea88"}
mmcv = {url = "https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/mmcv-2.1.0-cp311-cp311-manylinux1_x86_64.whl#sha256=7ef52b2495ae069d3dcc9f5c3a733ce149fe44000bcbb36d11557f6131674a33"}
numpy = "==1.26.4"
mmengine = "==0.10.7"
mmdet = "==3.3.0"
mmsegmentation = "==1.2.2"
torchlens = "==2.36.0"
pydantic = ">=2.0"
PyYAML = ">=6.0"
jsonschema = ">=4.18"
referencing = ">=0.28"
psutil = ">=5.9"
pyvips-binary = "==8.18.7"
opencv-python-headless = "*"

[tasks]
canary = "python canary.py"
