# torch-gpu: torch-main's packages with CUDA 12.4 torch 2.6 (the worker GPU's driver 550 runs 12.4), for
# request mode `gpu` in the GPU window. setuptools, wheel and ninja let torch's extension builder
# compile a recipe's CUDA ops inside the sandbox (nvcc from the host's CUDA toolkit), so a failed
# build is `compiled_ext`. Built by `menagerie-pipeline envs build torch-gpu` from uv.lock; the build
# runs canary.py, which touches the GPU only when MENAGERIE_GPU_CANARY=1 (inside the window).
[project]
name = "menagerie-env-torch-gpu"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.6.*",
    "torchvision==0.21.*",
    "torchlens==2.36.0",
    "timm==1.0.30",
    "transformers",
    "diffusers",
    "segmentation-models-pytorch",
    "ultralytics",
    "einops",
    "setuptools",
    "wheel",
    "ninja",
    # Menagerie's runtime dependencies, so the worker runs here without installing anything.
    "numpy",
    "packaging",
    "tqdm",
    "psutil>=5.9",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.28",
    "pillow",
    # The renderer's packages (render.EXTRAS; declared non-trace roots).
    "pyvips[binary]==3.2.0",
    "pyvips-binary==8.18.7",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
